<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Controle do LED via ESP32 - E-lab</title>
    <style>
        body { 
            font-family: Arial, sans-serif; 
            text-align: center; 
            margin-top: 50px; 
            background-color: #cad5e6;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0px 4px 10px rgba(0,0,0,0.1);
            display: inline-block;
            margin-top: 20px;
        }
        .hidden { display: none; }
        input { 
            margin: 10px 0; 
            padding: 10px; 
            font-size: 16px; 
            width: 80%;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        button { 
            margin: 10px; 
            padding: 12px 24px; 
            font-size: 16px; 
            cursor: pointer;
            border: none;
            border-radius: 5px;
            background-color: #007bff;
            color: white;
            font-weight: bold;
        }
        button:hover { background-color: #0056b3; }
        .btn-desligar { background-color: #dc3545; }
        .btn-desligar:hover { background-color: #a71d2a; }
        .btn-sair { background-color: #6c757d; font-size: 14px; padding: 8px 16px;}
        .btn-sair:hover { background-color: #5a6268; }
    </style>
</head>
<body>

    <h1>Painel Controle</h1>

    <!-- TELA DE LOGIN -->
    <div id="login-screen" class="container">
        <h2>Login</h2>
        <input type="email" id="email" placeholder="E-mail" required><br>
        <input type="password" id="password" placeholder="Senha" required><br>
        <button onclick="fazerLogin()">Entrar no Sistema</button>
        <p id="error-msg" style="color: red; font-size: 14px;"></p>
    </div>

    <!-- TELA PRINCIPAL DE CONTROLE (ESCONDIDA INICIALMENTE) -->
    <div id="app-screen" class="container hidden">
        <h2>Controle do LED via ESP32</h2>
        <!-- TEXTO DE STATUS DO LED -->
        <p style="font-size: 18px; font-weight: bold; margin: 20px 0;">
            Status: <span id="status-led" style="color: gray;">Carregando...</span>
        </p>

        <button onclick="ligarRele()">LIGAR</button>
        <button class="btn-desligar" onclick="desligarRele()">DESLIGAR</button>
        <br><br><br>
        <button class="btn-sair" onclick="fazerLogout()">Sair da Conta</button>
    </div>

    <!-- MÓDULOS DO FIREBASE (Versão 8 Compat para simplificar HTML puro) -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <script>
        // 1. CREDENCIAIS DO SEU PROJETO FIREBASE
        const firebaseConfig = {
            apiKey: "AIzaSyBRsIYpE5dIQw1hueu3GO2bL15LsY1O1Nw",
            databaseURL: "https://esp32-led-teste-default-rtdb.firebaseio.com"
        };

        // 2. INICIALIZA O FIREBASE
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.database();

        // REGRA DE LEITURA EM TEMPO REAL
        db.ref("/controle/led_embutido").on("value", (snapshot) => {
            const valor = snapshot.val();
            const statusElement = document.getElementById("status-led");

            if (valor === 1) {
                statusElement.innerText = "LED LIGADO";
                statusElement.style.color = "#28a745"; // Verde
            } else {
                statusElement.innerText = "LED DESLIGADO";
                statusElement.style.color = "#dc3545"; // Vermelho
            }
        });

        // 3. FUNÇÃO DE LOGIN
        function fazerLogin() {
            const email = document.getElementById("email").value;
            const password = document.getElementById("password").value;
            const errorMsg = document.getElementById("error-msg");

            if(email === "" || password === "") {
                errorMsg.innerText = "Preencha todos os campos.";
                return;
            }

            errorMsg.innerText = "Autenticando...";
            errorMsg.style.color = "blue";

            auth.signInWithEmailAndPassword(email, password)
                .then((userCredential) => {
                    // Se a senha estiver certa, esconde o login e mostra os botões
                    document.getElementById("login-screen").classList.add("hidden");
                    document.getElementById("app-screen").classList.remove("hidden");
                    errorMsg.innerText = "";
                    
                    // Limpa os campos de senha por segurança
                    document.getElementById("email").value = "";
                    document.getElementById("password").value = "";
                })
                .catch((error) => {
                    errorMsg.style.color = "red";
                    // Traduz os erros mais comuns
                    if(error.code === 'auth/user-not-found' || error.code === 'auth/wrong-password') {
                        errorMsg.innerText = "E-mail ou senha incorretos!";
                    } else {
                        errorMsg.innerText = "Erro: " + error.message;
                    }
                });
        }

        // 4. FUNÇÕES DE CONTROLE (Só têm permissão de rodar se o login foi feito)
        function ligarRele() {
            db.ref("/controle/led_embutido").set(1);
        }

        function desligarRele() {
            db.ref("/controle/led_embutido").set(0);
        }

        // 5. FUNÇÃO PARA DESLOGAR E TRANCAR O SITE NOVAMENTE
        function fazerLogout() {
            auth.signOut().then(() => {
                document.getElementById("app-screen").classList.add("hidden");
                document.getElementById("login-screen").classList.remove("hidden");
            });
        }
    </script>
</body>
</html>
