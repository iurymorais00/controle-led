<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Controle Simples de LED</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #222;
        }
        .container {
            text-align: center;
            background: #333;
            padding: 50px;
            border-radius: 15px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.3);
        }
        h2 {
            color: #fff;
            margin-bottom: 30px;
            margin-top: 0;
        }
        .btn {
            background-color: #ff3b30;
            color: white;
            border: none;
            padding: 20px 50px;
            font-size: 24px;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: bold;
            box-shadow: 0 4px 15px rgba(255, 59, 48, 0.4);
        }
        .btn:hover {
            transform: scale(1.05);
        }
        .btn.ligado {
            background-color: #34c759;
            box-shadow: 0 4px 15px rgba(52, 199, 89, 0.4);
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Painel do ESP32</h2>
        <button id="btnToggle" class="btn">DESLIGADO</button>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        // Suas chaves exatas do Firebase
        const firebaseConfig = {
            apiKey: "AIzaSyBRsIYpE5dIQw1hueu3GO2bL15LsY1O1Nw",
            authDomain: "esp32-led-teste.firebaseapp.com",
            databaseURL: "https://esp32-led-teste-default-rtdb.firebaseio.com",
            projectId: "esp32-led-teste",
            storageBucket: "esp32-led-teste.firebasestorage.app",
            messagingSenderId: "512436990281",
            appId: "1:512436990281:web:d784a769ffec9a1fa46a98"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        
        const ledRef = ref(db, 'controle/led_embutido');
        const btn = document.getElementById('btnToggle');
        
        let estadoAtual = 0;

        onValue(ledRef, (snapshot) => {
            estadoAtual = snapshot.val() || 0;
            
            if (estadoAtual === 1) {
                btn.classList.add('ligado');
                btn.innerText = "LIGADO";
            } else {
                btn.classList.remove('ligado');
                btn.innerText = "DESLIGADO";
            }
        });

        btn.addEventListener('click', () => {
            const novoEstado = estadoAtual === 0 ? 1 : 0;
            set(ledRef, novoEstado);
        });
    </script>
</body>
</html>
